[project]
name = "melox-autosync"
version = "0.1.0"
description = "MeloX-AutoSync: offline multilingual (zh/ja/en) lyrics-to-audio forced alignment engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "MeloX-AutoSync contributors" }]
keywords = ["lyrics", "forced-alignment", "ctc", "karaoke", "offline", "asr"]

dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.2",
    "transformers>=4.40,<6",
    "soundfile>=0.12",
    # Required when Hugging Face downloads go through a SOCKS5 proxy
    # (common on restricted networks). Harmless otherwise.
    "socksio>=1.0",
]

[project.optional-dependencies]
# Chinese FunASR `fa-zh` adapter. Installed only when the zh model is needed.
funasr = [
    "funasr>=1.1",
    "modelscope>=1.15",
    "kaldi-native-fbank>=1.20",
]
# Japanese singing alignment via pyshiro (GPLv3 code, not vendored) + G2P.
shiro = [
    "numba>=0.59",
    "msgpack>=1.0",
    "pyopenjtalk>=0.3",
    "scipy>=1.11",
]
# ONNX export / Android delivery toolchain (android_export/). Not needed for
# normal inference; request explicitly with `uv sync --extra onnx`.
onnx = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
autosync = "autosync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autosync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
# Weights are never vendored; they are downloaded into ./models (gitignored).
# Chinese extras are optional and must be requested explicitly.
